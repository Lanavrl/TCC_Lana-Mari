<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontawesome-free-6.7.2-web/css/all.min.css">
</head>
<body>
    <!--MODAL --> 
    <div id="modal_comojogar">
        <div id="bt-fechar-jogar">x</div>
        <div class="titulo-2">Como jogar</div>
    </div>
    <!--MODAL --> 
    <div id="modal_sobrenos">
        <div id="bt-fechar-sobre">x</div>
        <div class="titulo-2">Sobre nós</div>
    </div>

    <div class="titulo">
        <h1 id="titulo">Título</h1>
        <div class="pontuacao">
            <div>Pontuação atual:  <span id="pont_atual"> X </span></div>
            <div>Melhor pontuação: <span id="pont_melhor"> X </span></div>
        </div>
    </div>
    
    <input id="pesquisa" type="text">
    <div id="previa-nomes">
        
    </div>
    <br>
    <div id="grids" class="grids">
    <div class="container-grid" id="caracteristicas">
        <div class="item">Nome</div>
        <div class="item">Lançamento</div>
        <div class="item">Núcleo</div>
        <div class="item">Modelo</div>
        <div class="item">Linguagem</div>
        <div class="item">Status</div>
        <div class="item">Plataforma</div>
        <div class="item">Mantenedor</div>
        <div class="item">BITS</div>
    </div>
   
    </div>
    <nav class="info">
        <div id="bt-abrir-jogar">? Como jogar</div>
        <div id="bt-abrir-sobre">@ Sobre nós</div>
    </nav>
    <script src="script.js"></script>
</body>
</html>
